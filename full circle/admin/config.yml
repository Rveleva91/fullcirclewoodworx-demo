backend:
  name: git-gateway
  branch: main

media_folder: "full circle/images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Business Info"
        name: "business-info"
        file: "full circle/data/settings.json"
        fields:
          - {label: "Business Name", name: "name", widget: "string"}
          - {label: "Phone Number", name: "phone", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Address", name: "address", widget: "string"}
          - {label: "Hours", name: "hours", widget: "text"}

  - name: "gallery"
    label: "Gallery"
    folder: "full circle/images/gallery"
    create: true
    fields:
      - {label: "Photo Title", name: "title", widget: "string"}
      - {label: "Photo", name: "image", widget: "image"}
      - {label: "Description", name: "description", widget: "text", required: false}
